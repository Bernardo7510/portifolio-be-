                <h2 class="contato-header">Me Chama aí!</h2>

                    <div class="input-block">
                        <input type="text" id="nome" required placeholder=" ">

                    </div>

                                type="text"
                                id="telefone"
                                maxlength="15"
                                required
                                placeholder=" "
                            >
                            <label for="telefone">Telefone</label>
                        </div>

                        <div class="input-block">
                            <input
                                type="email"
                                id="email"
                                required
                                placeholder=" "
                            >
                            <label for="email">E-mail</label>
                        </div>

                    </div>

                    <div class="input-block">
                        <textarea
                            id="mensagem"
                            required
                            placeholder=" "
                        ></textarea>

                        <label for="mensagem">Sua Mensagem</label>
                    </div>

                    <button type="submit" class="btn-submit">
                        Enviar Proposta
                    </button>

                </form>
